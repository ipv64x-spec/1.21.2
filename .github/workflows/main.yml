name: Build PojavTierTagger 1.21.2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # allows manual runs from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/loom-cache
          key: ${{ runner.os }}-gradle-1.21.2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-1.21.2-
            ${{ runner.os }}-gradle-

      - name: Build 1.21.2
        run: ./gradlew ":1.21.2:build" --configure-on-demand

      - name: Upload built jar for 1.21.2
        uses: actions/upload-artifact@v4
        with:
          name: PojavTierTagger-1.21.2
          path: versions/1.21.2/build/libs/*.jar
          if-no-files-found: error
